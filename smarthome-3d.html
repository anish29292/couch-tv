<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home — 3D Apartment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15/dist/nouislider.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0d0c14; overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif; color: #fff; }
    #canvas-container { position: absolute; inset: 0; }
    #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; }

    #hud { position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between; }

    #top-bar { display: flex; align-items: center; justify-content: space-between;
      padding: 24px 48px 0; }
    #top-bar h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; opacity: 0.85; }
    #clock { font-size: 20px; font-weight: 200; opacity: 0.6; letter-spacing: 0.04em; }
    #reset-view-btn {
      pointer-events: all;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
      border-radius: 10px; color: rgba(255,255,255,0.7); padding: 7px 14px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.06em; cursor: pointer;
      font-family: inherit; transition: background 0.2s, opacity 0.2s, border-color 0.2s;
      opacity: 0; transform: translateY(-4px);
      transition: background 0.2s, border-color 0.2s, opacity 0.3s, transform 0.3s;
    }
    #reset-view-btn.visible { opacity: 1; transform: translateY(0); }
    #reset-view-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); color: #fff; }

    #room-label { position: absolute; top: 46%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,8,20,0.55); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(24px); border-radius: 40px; padding: 10px 28px;
      font-size: 17px; font-weight: 500; letter-spacing: 0.07em;
      opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #room-label.visible { opacity: 1; }

    #bottom-panel { display: flex; flex-direction: column; gap: 10px; padding: 0 48px 28px; }
    #scenes-row { display: flex; gap: 8px; }
    .scene-btn { pointer-events: all;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 9px 18px; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.8); cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.12s; outline: none; }
    .scene-btn:hover, .scene-btn.focus {
      background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.35); transform: scale(1.04); }
    .scene-btn.active { background: rgba(255,168,40,0.2); border-color: rgba(255,168,40,0.55); color: #ffbe50; }

    #rooms-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .room-btn { pointer-events: all; display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.7); cursor: pointer; transition: all 0.2s; outline: none; font-family: inherit; }
    .room-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.18); flex-shrink: 0; transition: background 0.3s; }
    .room-btn.active { background: rgba(79,195,247,0.12); border-color: rgba(79,195,247,0.4); color: #fff; }
    .room-btn.active .dot { background: #4fc3f7; box-shadow: 0 0 6px rgba(79,195,247,0.6); }
    .room-btn:hover, .room-btn.focus {
      background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.28); transform: scale(1.04); }
    .focus-ring { outline: 2px solid rgba(255,255,255,0.75) !important; outline-offset: 2px !important; }
    #nav-hint { position: absolute; bottom: 28px; right: 48px; font-size: 11px;
      opacity: 0.3; line-height: 1.9; text-align: right; }
    #loading { position: absolute; inset: 0; background: #0d0c14;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; transition: opacity 0.7s; z-index: 100; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-text { font-size: 14px; opacity: 0.45; letter-spacing: 0.1em; text-transform: uppercase; }
    .spinner { width: 32px; height: 32px; border: 1.5px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,180,50,0.85); border-radius: 50%; animation: spin 0.85s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Phase 3: Room panel ───────────────────────────── */
    #room-panel {
      position: absolute; top: 0; right: 0; width: 300px; height: 100%;
      background: rgba(5,4,14,0.90);
      border-left: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(40px) saturate(1.8);
      -webkit-backdrop-filter: blur(40px) saturate(1.8);
      display: flex; flex-direction: column;
      padding: 0; gap: 0;
      pointer-events: none; visibility: hidden;
      z-index: 30; overflow: hidden;
      transform: translateX(300px);
    }
    #panel-header {
      display: flex; align-items: center; gap: 10px;
      padding: 22px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    #panel-back {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: #fff; opacity: 0.55; padding: 6px 11px;
      font-size: 11px; cursor: pointer; letter-spacing: 0.06em; font-family: inherit;
      transition: opacity 0.2s, background 0.2s; flex-shrink: 0;
    }
    #panel-back:hover { opacity: 1; background: rgba(255,255,255,0.10); }
    #panel-header-right { display: flex; flex-direction: column; flex: 1; gap: 1px; }
    #room-panel-title {
      font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; opacity: 0.90;
    }
    #panel-room-subtitle { font-size: 10px; opacity: 0.28; letter-spacing: 0.06em; }
    #panel-room-icon { font-size: 20px; flex-shrink: 0; }
    /* Room master power pill */
    .toggle-pill {
      width: 40px; height: 22px; border-radius: 11px;
      background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.12);
      position: relative; cursor: pointer; flex-shrink: 0;
      transition: background 0.22s, border-color 0.22s; outline: none;
    }
    .toggle-pill.on { background: #4fc3f7; border-color: #4fc3f7; }
    .toggle-pill::after {
      content:''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.45);
      transition: left 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .toggle-pill.on::after { left: 21px; }

    /* ── Scrollable device list ── */
    #room-panel-cards {
      flex: 1; overflow-y: auto; padding: 8px 0 4px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    #room-panel-cards::-webkit-scrollbar { width: 3px; }
    #room-panel-cards::-webkit-scrollbar-track { background: transparent; }
    #room-panel-cards::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 4px; }

    /* ── Device row — compact horizontal ── */
    .device-card {
      display: flex; flex-direction: column;
      padding: 0 20px;
      border-left: 2px solid transparent;
      transition: background 0.18s, border-color 0.18s;
      cursor: pointer;
      position: relative;
    }
    .device-card:hover { background: rgba(255,255,255,0.03); }
    .device-card.selected {
      background: rgba(79,195,247,0.05);
      border-left-color: rgba(79,195,247,0.6);
    }
    .device-card.selected .device-card-name { color: #fff; }
    .device-card-main-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0 4px;
    }
    .device-card-icon {
      font-size: 15px; opacity: 0.65; width: 20px; text-align: center; flex-shrink: 0;
    }
    .device-card.selected .device-card-icon { opacity: 1.0; }
    .device-card-info { flex: 1; min-width: 0; }
    .device-card-name {
      font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.80);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .device-card-status {
      font-size: 10px; color: rgba(255,255,255,0.28); margin-top: 1px; letter-spacing: 0.04em;
    }
    .device-card.selected .device-card-status { color: rgba(79,195,247,0.7); }
    .device-card-controls {
      padding: 0 0 12px 32px;
      display: none;
    }
    .device-card.selected .device-card-controls { display: block; }
    /* Separator line between rows */
    .device-card + .device-card::before {
      content: ''; display: block; height: 1px;
      background: rgba(255,255,255,0.04);
      margin: 0;
    }
    /* noUiSlider skin */
    .device-card-slider { padding: 6px 0 4px; }
    .noUi-target {
      background: rgba(255,255,255,0.08) !important; border: none !important;
      box-shadow: none !important; border-radius: 4px !important; height: 3px !important;
    }
    .noUi-connect { background: rgba(79,195,247,0.7) !important; }
    .noUi-handle {
      width: 14px !important; height: 14px !important;
      right: -7px !important; top: -5.5px !important;
      background: #fff !important; border: 2px solid #4fc3f7 !important;
      border-radius: 50% !important; box-shadow: 0 0 6px rgba(79,195,247,0.5) !important;
      cursor: pointer !important;
    }
    .noUi-handle::before, .noUi-handle::after { display: none !important; }
    .noUi-tooltip { display: none !important; }
    /* ── Color swatches ── */
    .color-swatch-row { display:flex; gap:6px; align-items:center; padding:6px 0 2px; flex-wrap:wrap; }
    .color-swatch {
      width:20px; height:20px; border-radius:50%; cursor:pointer; flex-shrink:0;
      border:2px solid transparent; transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .color-swatch:hover { transform:scale(1.22); }
    .color-swatch.active { border-color:rgba(255,255,255,0.90); box-shadow:0 0 8px rgba(255,255,255,0.38); }
    .color-custom-btn {
      width:20px; height:20px; border-radius:50%; cursor:pointer; flex-shrink:0;
      background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
      border:2px solid rgba(255,255,255,0.18); transition:transform .15s, border-color .15s;
    }
    .color-custom-btn:hover { transform:scale(1.22); border-color:rgba(255,255,255,0.60); }
    .iro-wrap { margin-top:6px; display:none; padding:0 0 4px; justify-content:center; }
    .iro-wrap.open { display:flex; }
    /* ── Panel room scenes strip ── */
    #panel-scenes {
      padding: 12px 20px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    #panel-scenes-title { font-size:10px; opacity:0.28; letter-spacing:0.10em; text-transform:uppercase; margin-bottom:8px; }
    #panel-scenes-row { display:flex; gap:6px; flex-wrap:wrap; }
    .panel-scene-btn {
      pointer-events:all; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07);
      border-radius:8px; padding:6px 11px; font-size:11px; font-weight:500; color:rgba(255,255,255,0.55);
      cursor:pointer; font-family:inherit; transition:background .2s, border-color .2s, color .2s;
    }
    .panel-scene-btn:hover { background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.20); color:rgba(255,255,255,0.85); }
    .panel-scene-btn.active { background:rgba(255,168,40,0.15); border-color:rgba(255,168,40,0.45); color:#ffbe50; }

    /* ── Phase 3: Hotspot bubble ──────────────────────── */
    #bubble {
      position: absolute; display: none;
      background: rgba(7,6,18,0.92);
      border: 1px solid rgba(255,255,255,0.11);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 16px; padding: 16px 18px 18px;
      min-width: 210px; z-index: 50;
      pointer-events: auto;
      transform-origin: bottom center;
    }
    #bubble-title {
      font-size: 11px; opacity: 0.4; text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 12px;
    }
    #bubble-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    #bubble-label { font-size: 14px; font-weight: 500; }
    #bubble-close {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none; color: #fff; opacity: 0.25;
      font-size: 14px; cursor: pointer; padding: 2px 5px; font-family: inherit;
      transition: opacity 0.15s;
    }
    #bubble-close:hover { opacity: 0.7; }
    #bubble-slider-wrap { height: 4px; margin-top: 4px; }
    /* ── Hotspot indicator — warm amber target ring matching theme ── */
    .hs-ring {
      position: absolute; transform: translate(-50%,-50%);
      pointer-events: none; z-index: 20;
      width: 32px; height: 32px;
    }
    .hs-ring::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(255,190,80,0.70);
      box-shadow: 0 0 8px rgba(255,160,40,0.35), inset 0 0 4px rgba(255,160,40,0.10);
    }
    .hs-ring::after {
      content: ''; position: absolute;
      left: 50%; top: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,200,80,0.90);
      box-shadow: 0 0 7px rgba(255,160,40,0.85);
      transform: translate(-50%,-50%);
    }
    .hs-ring.selected::before {
      border-color: rgba(255,220,120,0.95);
      box-shadow: 0 0 14px rgba(255,180,50,0.60), 0 0 24px rgba(255,140,30,0.30);
      animation: hsSelect 0.35s ease-out forwards;
    }
    @keyframes hsSelect {
      0%   { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    /* ── Color swatches ── */
    .color-swatch-row { display:flex; gap:6px; align-items:center; padding:6px 0 2px; flex-wrap:wrap; }
    .color-swatch {
      width:20px; height:20px; border-radius:50%; cursor:pointer; flex-shrink:0;
      border:2px solid transparent; transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .color-swatch:hover { transform:scale(1.22); }
    .color-swatch.active { border-color:rgba(255,255,255,0.90); box-shadow:0 0 8px rgba(255,255,255,0.38); }
    .color-custom-btn {
      width:20px; height:20px; border-radius:50%; cursor:pointer; flex-shrink:0;
      background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
      border:2px solid rgba(255,255,255,0.18); transition:transform .15s, border-color .15s;
    }
    .color-custom-btn:hover { transform:scale(1.22); border-color:rgba(255,255,255,0.60); }
    .iro-wrap { margin-top:6px; display:none; padding:0 0 4px; justify-content:center; }
    .iro-wrap.open { display:flex; }
  </style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="loading-text">Loading…</div></div>
<div id="canvas-container"></div>
<div id="hud">
  <div id="top-bar"><h1>Smart Home</h1><button id="reset-view-btn">⟳ Reset View</button><div id="clock"></div></div>
  <div id="room-label"></div>
  <div id="bottom-panel">
    <div id="rooms-row">
      <button class="room-btn" data-room="living">  <span class="dot"></span>Living</button>
      <button class="room-btn" data-room="bedroom"> <span class="dot"></span>Bedroom</button>
      <button class="room-btn" data-room="kitchen"> <span class="dot"></span>Kitchen</button>
      <button class="room-btn" data-room="hall">    <span class="dot"></span>Hallway</button>
      <button class="room-btn" data-room="loggia">  <span class="dot"></span>Balcony</button>
      <button class="room-btn" data-room="bathroom"><span class="dot"></span>Bathroom</button>
    </div>
    <div id="scenes-row">
      <button class="scene-btn" data-scene="movie">🎬 Movie Night</button>
      <button class="scene-btn" data-scene="relax">🌿 Relax</button>
      <button class="scene-btn" data-scene="dinner">🍷 Dinner</button>
      <button class="scene-btn" data-scene="party">🎉 Party</button>
      <button class="scene-btn" data-scene="goodnight">🌙 Goodnight</button>
    </div>
  </div>
</div>
<div id="nav-hint">D-pad: navigate &amp; select<br>OK: toggle / zoom<br>Back: overview</div>

<!-- Phase 3: Room panel -->
<div id="room-panel">
  <div id="panel-header">
    <button id="panel-back">← Back</button>
    <span id="panel-room-icon"></span>
    <div id="panel-header-right">
      <span id="room-panel-title"></span>
      <span id="panel-room-subtitle"></span>
    </div>
    <button class="toggle-pill" id="room-power-toggle" title="All lights in room"></button>
  </div>
  <div id="room-panel-cards"></div>
</div>

<!-- Phase 3: Hotspot bubble -->
<div id="bubble">

  <div id="bubble-title"></div>
  <div id="bubble-row">
    <span id="bubble-label"></span>
    <button class="toggle-pill" id="bubble-toggle"></button>
  </div>
  <div id="bubble-slider-wrap"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nouislider@15/dist/nouislider.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5/dist/iro.min.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RectAreaLightHelper } from 'three/addons/helpers/RectAreaLightHelper.js';

RectAreaLightUniformsLib.init();

// ─────────────────────────────────────────────
// LAYOUT CONSTANTS
// X = West→East (0=west wall, 10=east wall)
// Z = North→South (0=north, 8.8=south/loggia threshold)
// ─────────────────────────────────────────────
const W_H = 2.5, W_T = 0.15, F_T = 0.08;
const R = {
  bad:      { x:0,   z:0,   w:3.0, d:2.8 },
  diele:    { x:3.0, z:0,   w:2.2, d:2.8 },
  kueche:   { x:5.2, z:0,   w:4.8, d:2.8 },
  schlafen: { x:0,   z:2.8, w:4.2, d:6.0 },
  wohnen:   { x:4.2, z:2.8, w:5.8, d:6.0 },
  loggia:   { x:0,   z:8.8, w:10,  d:2.0 },
};
const APT_W = 10.0, APT_D = 8.8, PX = 4.2; // PX = partition X

// ─────────────────────────────────────────────
// PROCEDURAL TEXTURES
// ─────────────────────────────────────────────
function makeWoodFloorTexture(w=512, h=512) {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  const baseColor = '#c07838';
  ctx.fillStyle = baseColor; ctx.fillRect(0,0,w,h);
  const nPlanks = 6;
  const plankH = h / nPlanks;
  const plankColors = ['#b87030','#c88040','#b06828','#d09050','#a86020','#c07838'];
  for (let p=0; p<nPlanks; p++) {
    const y0 = p * plankH;
    ctx.fillStyle = plankColors[p % plankColors.length];
    ctx.fillRect(0, y0, w, plankH - 1.5);
    // grain lines
    ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 0.8;
    for (let g=0; g<12; g++) {
      const gx = (g/12)*w + (Math.random()-0.5)*20;
      ctx.beginPath(); ctx.moveTo(gx, y0); ctx.lineTo(gx + (Math.random()-0.5)*30, y0+plankH); ctx.stroke();
    }
    // plank gap
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, y0+plankH-2, w, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3,3);
  return t;
}

function makeWallTexture() {
  const c = document.createElement('canvas'); c.width=256; c.height=256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f4ede2'; ctx.fillRect(0,0,256,256);
  // subtle noise
  for (let i=0; i<800; i++) {
    const x=Math.random()*256, y=Math.random()*256, r=Math.random()*2;
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.025})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2,1);
  return t;
}

function makeRoughTexture(base='#1a1a1a') {
  const c = document.createElement('canvas'); c.width=128; c.height=128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base; ctx.fillRect(0,0,128,128);
  for (let i=0; i<400; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.04})`;
    ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  }
  return new THREE.CanvasTexture(c);
}

const floorTex   = makeWoodFloorTexture();
const wallTex    = makeWallTexture();
const darkTex    = makeRoughTexture('#181818');
const concreteTex = makeRoughTexture('#c0bbb5');

// ─────────────────────────────────────────────

function applyLightState() {
  // Quadratic glow: pale at low brightness, deep+bright at high brightness.
  // g(0)=0, g(0.3)≈0.09, g(0.7)≈0.49, g(1.0)=1.0
  function glow(bri) { return bri * bri; }

  // ── Point lights ──────────────────────────────────────────
  for (const [id,st] of Object.entries(lightState)) {
    const pl = pointLights[id];
    if (!pl) continue;
    // Higher base intensity since global ambient is now fixed-low; local PL is the primary illuminator.
    pl.intensity = st.on ? glow(st.brightness) * 14.0 : 0;
    if (st.on && st.color) {
      const [r,g,b] = st.color;
      pl.color.setRGB(r/255, g/255, b/255);
    } else if (!st.on) {
      pl.color.setHex(0xffd890); // reset to neutral warm when off
    }
  }
  // ── TV backlight: emissive glow meshes + halo PL ──────────
  if (tvRectLights.length > 0) {
    const tvSt = lightState['tv-backlight'];
    const on = tvSt.on, g2 = glow(tvSt.brightness);
    const [r,g,b] = tvSt.color || [180,60,255];
    tvRectLights.forEach((item) => {
      if (item.isMesh) {
        item.material.emissiveIntensity = on ? g2 * 5.0 : 0;
        if (on) item.material.emissive.setRGB(r/255, g/255, b/255);
      } else {
        item.intensity = on ? g2 * 18.0 : 0;
        if (on) item.color.setRGB(r/255, g/255, b/255);
      }
    });
  }
  // ── Couch LED strip — emissive meshes + secondary PL ──────
  if (couchLedMeshes.length > 0) {
    const cSt = lightState['couch-light'];
    const [r,g,b] = cSt.color || [255,140,20];
    const g2 = glow(cSt.brightness);
    couchLedMeshes.forEach(item => {
      if (item.isMesh) {
        item.material.emissiveIntensity = cSt.on ? g2 * 4.0 : 0;
        if (cSt.on) item.material.emissive.setRGB(r/255, g/255, b/255);
      } else {
        item.intensity = cSt.on ? g2 * 4.5 : 0;
        if (cSt.on) item.color.setRGB(r/255, g/255, b/255);
      }
    });
  }
  // ── Washer status LED ──────────────────────────────────────
  if (washerLedMat !== null) {
    const wSt = lightState['washer'];
    if (wSt.on) {
      washerLedMat.color.setHex(0x22cc44); washerLedMat.emissive.setHex(0x00cc22); washerLedMat.emissiveIntensity = 1.5;
    } else {
      washerLedMat.color.setHex(0xcc2222); washerLedMat.emissive.setHex(0xcc0000); washerLedMat.emissiveIntensity = 1.2;
    }
  }
  // ── Arc lamp drum shade — glows with selected colour ──────
  if (arcShadeMat && arcGlowMat) {
    const aSt = lightState['arc-lamp'];
    const [r,g,b] = aSt.color || [255,200,130];
    const nr = r/255, ng = g/255, nb = b/255;
    const ag = aSt.on ? glow(aSt.brightness) : 0;
    const sideGlowMat = shadeTip?._sideGlowMat;
    if (aSt.on) {
      arcShadeMat.emissive.setRGB(nr, ng, nb);
      arcShadeMat.emissiveIntensity = ag * 3.5;
      arcShadeMat.color.setRGB(0.82 + nr * 0.15, 0.76 + ng * 0.15, 0.70 + nb * 0.15);
      arcGlowMat.emissive.setRGB(nr, ng, nb);
      arcGlowMat.emissiveIntensity = ag * 8.0;
      arcGlowMat.color.setRGB(nr, ng, nb);
      if (sideGlowMat) {
        sideGlowMat.emissive.setRGB(nr, ng, nb);
        sideGlowMat.color.setRGB(nr, ng, nb);
        sideGlowMat.emissiveIntensity = ag * 5.0;
      }
    } else {
      arcShadeMat.emissive.setRGB(0, 0, 0);
      arcShadeMat.emissiveIntensity = 0;
      arcShadeMat.color.setRGB(0.96, 0.93, 0.88);
      arcGlowMat.emissive.setRGB(0, 0, 0);
      arcGlowMat.emissiveIntensity = 0;
      arcGlowMat.color.setRGB(0.4, 0.38, 0.35);
      if (sideGlowMat) {
        sideGlowMat.emissive.setRGB(0, 0, 0);
        sideGlowMat.emissiveIntensity = 0;
        sideGlowMat.color.setRGB(0.4, 0.38, 0.35);
      }
    }
    arcShadeMat.needsUpdate = true;
    arcGlowMat.needsUpdate = true;
    if (sideGlowMat) sideGlowMat.needsUpdate = true;
  }
  // ── Cage pendant bulbs — MeshBasicMaterial, HDR boost for saturation ─
  for (const [mat, id] of [[pendant1BulbMat,'pendant-1'],[pendant2BulbMat,'pendant-2']]) {
    if (!mat) continue;
    const st = lightState[id];
    const [r,g,b] = st.color || [255,228,181];
    const nr = r/255, ng = g/255, nb = b/255;
    if (st.on) {
      const pg = glow(st.brightness);
      // Boost above 1.0 so ACES preserves hue saturation (HDR → rich tone-mapped color).
      const boost = 0.4 + pg * 3.0;
      mat.color.setRGB(nr * boost, ng * boost, nb * boost);
    } else {
      mat.color.setRGB(0.32, 0.30, 0.28);
    }
    mat.needsUpdate = true;
  }
  // ── Cloud light — whole cloud glows with selected colour ───
  if (cloudMeshes.length > 0) {
    const cSt = lightState['bedroom-main'];
    const [r,g,b] = cSt.color || [255,200,150];
    const nr = r/255, ng = g/255, nb = b/255;
    const cg = cSt.on ? glow(cSt.brightness) : 0;
    cloudMeshes.forEach(item => {
      if (item.isBulb) {
        if (cSt.on) {
          item.material.color.setRGB(nr, ng, nb);
          item.material.emissive.setRGB(nr, ng, nb);
          item.material.emissiveIntensity = cg * 6.0;
        } else {
          item.material.emissive.setRGB(0, 0, 0);
          item.material.emissiveIntensity = 0;
          item.material.color.setRGB(0.32, 0.30, 0.28);
        }
      } else {
        if (cSt.on) {
          // MeshBasicMaterial: values clamp to [0,1]. Use raw normalized color.
          // Fully opaque, no transparency — avoids blending with warm background.
          const dim = cg;
          item.material.color.setRGB(nr * dim, ng * dim, nb * dim);
        } else {
          item.material.color.setRGB(0.88, 0.86, 0.84);
        }
      }
      item.material.needsUpdate = true;
    });
  }
  // ── Govee floor lamps — emissive strip + base glow ────────────
  for (const [id, mats] of Object.entries(goveeLampMats)) {
    const st = lightState[id];
    if (!st) continue;
    const [r,g,b] = st.color || [34,85,255];
    const nr = r/255, ng = g/255, nb = b/255;
    const col = new THREE.Color(nr, ng, nb);
    if (st.on) {
      const ag = glow(st.brightness);
      mats.strip.color.copy(col);
      mats.strip.emissive.copy(col);
      mats.strip.emissiveIntensity = 0.8 + ag * 2.5;
      mats.strip.opacity = 0.85 + ag * 0.12;
      mats.baseGlow.emissive.copy(col);
      mats.baseGlow.emissiveIntensity = 0.5 + ag * 2.0;
      mats.pl.color.copy(col);
      mats.pl.intensity = ag * 4.5;
    } else {
      mats.strip.color.setRGB(0.06, 0.06, 0.06);
      mats.strip.emissive.setRGB(0, 0, 0);
      mats.strip.emissiveIntensity = 0;
      mats.strip.opacity = 0.3;
      mats.baseGlow.emissive.setRGB(0, 0, 0);
      mats.baseGlow.emissiveIntensity = 0;
      mats.pl.intensity = 0;
    }
    mats.strip.needsUpdate = true;
    mats.baseGlow.needsUpdate = true;
  }
  // ── Global scene ambient — fixed night-mode base; local PointLights provide room light ──
  // Ambient stays low and fixed so each smart light illuminates only its vicinity.
  // The always-on fill PointLights (fills[]) provide per-room base warmth independently.
  ambLight.intensity = 0.12;
  ambLight.color.setRGB(0.94, 0.82, 0.60);
  keyLight.intensity = 0.08;
  fillNE.intensity   = 0.06;
  topLight.intensity = 0.05;
}
applyLightState();

function floor(x, z, w, d, mat, y=0) {

function makePlant(scale=1) {
  const g = new THREE.Group();
  const pot = cyl(0.11*scale, 0.14*scale, 0.22*scale, 10, M.plantPot);
  pot.position.y = 0.11*scale; g.add(pot);
  const stem = cyl(0.02*scale, 0.02*scale, 0.35*scale, 7, M.plant);
  stem.position.y = 0.22*scale+0.175*scale; g.add(stem);
  const crown = sph(0.22*scale, 10, M.plant);
  crown.position.y = 0.22*scale+0.35*scale+0.18*scale; g.add(crown);
  return g;
}
function makeTallPlant(scale=1) {
  const g = new THREE.Group();
  const pot = cyl(0.17*scale, 0.20*scale, 0.30*scale, 10, M.plantPot);
  pot.position.y = 0.15*scale; g.add(pot);
  const trunk = cyl(0.04*scale, 0.055*scale, 0.75*scale, 7, M.wood);
  trunk.position.y = 0.30*scale+0.375*scale; g.add(trunk);
  for (let i=0; i<7; i++) {
    const a = (i/7)*Math.PI*2;
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.14*scale, 8, 6), M.plantDark);
    leaf.scale.set(1, 2.6, 0.5);
    leaf.position.set(Math.cos(a)*0.18*scale, 0.30*scale+0.75*scale+i*0.1*scale, Math.sin(a)*0.18*scale);
    leaf.rotation.z = Math.cos(a)*0.4; g.add(leaf);
  }
  return g;
}

function makeGoveeLamp(id, x, z, color=0x2255ff) {
  const g = new THREE.Group();
  // Chunky cylinder base (matches Govee Floor Lamp 2 reference)
  const baseMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.3, metalness:0.8});
  const base = cyl(0.09, 0.11, 0.14, 20, baseMat);
  base.position.y = 0.07; g.add(base);
  // Slim dark pole
  const pole = cyl(0.008, 0.008, 1.70, 8, new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.2,metalness:0.9}));
  pole.position.y = 0.14 + 0.85; g.add(pole);
  // Full-height emissive LED strip running the length of the pole (the whole pole glows)
  const stripMat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 2.2,
    transparent: true, opacity: 0.9
  });
  const strip = cyl(0.012, 0.012, 1.68, 8, stripMat);
  strip.position.y = 0.14 + 0.84; g.add(strip);
  // Soft glow at base (illuminated base ring visible in reference)
  const baseGlowMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: color, emissiveIntensity: 1.5,
    transparent: true, opacity: 0.7
  });
  const baseGlow = cyl(0.088, 0.088, 0.06, 20, baseGlowMat);
  baseGlow.position.y = 0.03; g.add(baseGlow);
  g.position.set(x, 0, z);
  scene3.add(g);
  // Point light from lamp
  const pl = new THREE.PointLight(color, 3.5, 5.0);
  pl.position.set(x, 1.5, z);
  scene3.add(pl);
  if (id) {
    goveeLampMats[id] = { strip: stripMat, baseGlow: baseGlowMat, pl };
    pointLights[id] = pl;
  }
  return g;
}

// Base in SE corner: x near east wall, z near south wall but inside apartment.
// The arm sweeps WEST-NORTHWEST over the sofa. All parts are in one Group so
// the whole lamp is rigid — shade stays connected at every camera angle.
const LAMP_X = APT_W - 0.18;   // x: near east wall
const LAMP_Z = APT_D - 1.20;   // z: 1.2m from south wall — well inside living room, away from loggia

const arcGrp = new THREE.Group();

// Arc pivot at pole top — arm length 2.10m, sweeping west over sofa.
// Shade is PARENTED to the arm tip so it's always connected.
const arcPivot = new THREE.Group();
arcPivot.position.set(0, 1.80, 0);
arcGrp.add(arcPivot);

const ARM_LEN = 1.85;

// Curved arc arm using TubeGeometry along a Catmull-Rom spline.
// Control points in arcPivot-local space (pivot is at pole top, Y=1.80).
// The curve sweeps: straight up from pivot, arches forward (-Z) and slightly down.
// Final point at approximately (0, +0.45, -ARM_LEN) — above and forward.
{
  const pts = [
    new THREE.Vector3(0,  0.00,  0.00),  // pivot base
    new THREE.Vector3(0,  0.55, -0.35),  // early rise
    new THREE.Vector3(0,  0.80, -0.90),  // peak of arch
    new THREE.Vector3(0,  0.58, -1.40),  // descending
    new THREE.Vector3(0,  0.30, -ARM_LEN), // shade end
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const tubeGeo = new THREE.TubeGeometry(curve, 24, 0.013, 7, false);
  const arcTube = new THREE.Mesh(tubeGeo, M.darkMetal);
  arcPivot.add(arcTube);
  // Store tip for shadeTip parenting
  arcPivot._tipX = pts[4].x;
  arcPivot._tipY = pts[4].y;
  arcPivot._tipZ = pts[4].z;
}

// Point arm toward sofa centre (west-northwest from SE lamp base).
// dx = sofaTarget.x - LAMP_X (negative = west), dz = sofaTarget.z - LAMP_Z (negative = north)
// arm tip at local (0,0,-ARM_LEN) after rotY → world offset (sin(rotY)*-ARM_LEN, 0, cos(rotY)*-ARM_LEN)
// So rotY = atan2(-dx, -dz) points local -Z toward (dx,dz).
const arcSofaX = SF_BACK_X - 0.80;   // ~9.10 — sofa centre, not back edge
const arcSofaZ = SF_Z;                // 7.2
arcPivot.rotation.order = 'YXZ';
arcPivot.rotation.y = Math.atan2(-(arcSofaX - LAMP_X), -(arcSofaZ - LAMP_Z));
arcPivot.rotation.x = -0.28;  // tilt arm slightly downward toward shade

// Shade group parented at arc tip
const shadeTip = new THREE.Group();
shadeTip.position.set(arcPivot._tipX, arcPivot._tipY, arcPivot._tipZ);
arcPivot.add(shadeTip);

// Outer drum shell: open-ended cylinder, cream/linen fabric material

  emissive: 0xffe8c0, emissiveIntensity: 0.0,

drumOuter.position.set(0, -drumH * 0.5, 0); // hang so top is at shade tip

// Cage pendant lights — black geometric wireframe cage with exposed Edison bulb inside.
// Group origin = ceiling surface. Everything built hanging downward (negative Y).
// cordLen = distance from ceiling to top of cage.
function makeCagePendant(cx, cz, cordLen) {
  const grp = new THREE.Group();
  const cageMat = M.darkMetal;
  const S = 0.17;    // half-size of cage in XZ
  const CH = 0.22;   // cage height
  const cageTop = -(cordLen + 0.045); // Y of cage top ring (canopy bottom)

  // Ceiling canopy disc (flat at ceiling)
  const canopy = cyl(0.072, 0.062, 0.042, 10, cageMat);
  canopy.position.set(0, -0.021, 0); grp.add(canopy);

  // Drop cord from canopy bottom to cage top
  const cord = cyl(0.004, 0.004, cordLen, 6, cageMat);
  cord.position.set(0, -(cordLen/2 + 0.042), 0); grp.add(cord);

  // 4 vertical corner rods of cage
  for (const [dx,dz] of [[-S,-S],[-S,S],[S,-S],[S,S]]) {
    const r = cyl(0.007,0.007, CH, 6, cageMat);
    r.position.set(dx, cageTop - CH/2, dz); grp.add(r);
  }
  // 4 top horizontal rails of cage (at cage top ring)
  for (const [[ax,az],[bx,bz]] of [
    [[-S,-S],[-S,S]], [[-S,S],[S,S]], [[S,S],[S,-S]], [[S,-S],[-S,-S]]
  ]) {
    const len = Math.sqrt((bx-ax)**2+(bz-az)**2);
    const r = box(len, 0.009, 0.009, cageMat);
    r.position.set((ax+bx)/2, cageTop, (az+bz)/2);
    r.rotation.y = Math.atan2(bx-ax, bz-az); grp.add(r);
  }
  // 4 bottom rails (at cage bottom ring)
  for (const [[ax,az],[bx,bz]] of [
    [[-S,-S],[-S,S]], [[-S,S],[S,S]], [[S,S],[S,-S]], [[S,-S],[-S,-S]]
  ]) {
    const len = Math.sqrt((bx-ax)**2+(bz-az)**2);
    const r = box(len, 0.009, 0.009, cageMat);
    r.position.set((ax+bx)/2, cageTop - CH, (az+bz)/2);
    r.rotation.y = Math.atan2(bx-ax, bz-az); grp.add(r);
  }
  // 4 diagonal struts from top corners converging to centre top (peak detail)
  for (const [dx,dz] of [[-S,-S],[-S,S],[S,-S],[S,S]]) {
    const diagLen = Math.sqrt(dx*dx + dz*dz + 0.04);
    const strut = cyl(0.005, 0.005, diagLen, 6, cageMat);
    strut.position.set(dx/2, cageTop + 0.02, dz/2);
    strut.rotation.x = Math.atan2(dz, 0.06);
    strut.rotation.z = -Math.atan2(dx, 0.06);
    grp.add(strut);
  }

  // Edison bulb inside cage — MeshBasicMaterial so cage fill lights don't
  // contaminate the emissive color (warm PointLights in dining area would otherwise
  // make red look pinkish-orange through MeshStandardMaterial).
  const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffe8b0 });
  const bulb = sph(0.058, 10, bulbMat);
  bulb.position.set(0, cageTop - CH*0.45, 0); grp.add(bulb);

  // Place group at ceiling height
  grp.position.set(cx, W_H, cz);
  scene3.add(grp);
  return { group: grp, bulbMat };
}

let activeIroPicker = null;
let activeIroId = null;

function openIroPicker(id, wrapEl) {
  // Close any existing picker
  if (activeIroId && activeIroId !== id) {
    const prev = document.getElementById(`iro-wrap-${activeIroId}`);
    if (prev) prev.classList.remove('open');
    if (activeIroPicker) { activeIroPicker = null; }
  }
  if (activeIroId === id && wrapEl.classList.contains('open')) {
    wrapEl.classList.remove('open');
    activeIroPicker = null; activeIroId = null;
    return;
  }
  wrapEl.classList.add('open');
  activeIroId = id;
  // Build iro picker if not already built
  if (!wrapEl._iroPicker) {
    const st = lightState[id];
    const [r,g,b] = st.color || [255,228,181];
    wrapEl._iroPicker = new iro.ColorPicker(wrapEl, {
      width: 180,
      color: `rgb(${r},${g},${b})`,
      layout: [
        { component: iro.ui.Wheel },
        { component: iro.ui.Slider, options: { sliderType: 'value' } },
      ],
      borderWidth: 1,
      borderColor: 'rgba(255,255,255,0.15)',
    });
    wrapEl._iroPicker.on('color:change', (color) => {
      const { r: cr, g: cg, b: cb } = color.rgb;
      lightState[id].color = [Math.round(cr), Math.round(cg), Math.round(cb)];
      applyLightState();
      if (window.dispatchSmartHomeCommand) window.dispatchSmartHomeCommand(id, { color: lightState[id].color });
      // Deactivate all swatches for this device (custom colour selected)
      const row = document.querySelector(`.color-swatch-row[data-id="${id}"]`);
      if (row) row.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    });
  }
  activeIroPicker = wrapEl._iroPicker;
}

function refreshPanelState(room) {
  const devices = ROOM_DEVICES[room.id] || [];
  for (const id of devices) {

// CAMERA HELPERS — preserve user's orbit angle
// ─────────────────────────────────────────────
// Returns the camera offset vector relative to its current target.
// We reuse this offset when zooming so the user's rotated view is preserved.
function getCamOffset() {
  return new THREE.Vector3().subVectors(camera.position, controls.target);
}

// Animate camera to look at a new target, optionally forcing a new offset.
// If forceOffset is null, preserves the current offset (user's rotation stays).
// If forceOffset is provided, smoothly transitions to that offset too.
// endSize optionally animates the orthographic camera frustum (zoom level).
// targetY lets us look at the device's actual height instead of the floor.
function animateCameraTo(newTargetX, newTargetZ, forceOffset=null, dur=1000, endSize=null, targetY=0) {
  const startPos   = camera.position.clone();
  const startTarget = controls.target.clone();
  const currentOffset = getCamOffset();
  const endOffset  = forceOffset || currentOffset;
  const endTarget  = new THREE.Vector3(newTargetX, targetY, newTargetZ);
  const endPos     = endTarget.clone().add(endOffset);
  const aspect = camera.right / camera.top;
  const startSize  = camera.top;
  const targetSize = endSize !== null ? endSize : startSize;
  const t0 = performance.now();
  camAnim = (now) => {
    const t = Math.min((now - t0) / dur, 1);
    const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
    camera.position.lerpVectors(startPos, endPos, ease);
    controls.target.lerpVectors(startTarget, endTarget, ease);
    if (endSize !== null) {
      const s = startSize + (targetSize - startSize) * ease;
      camera.left = -s * aspect; camera.right = s * aspect;
      camera.top = s; camera.bottom = -s;
      camera.updateProjectionMatrix();
    }
    controls.update();
    if (t >= 1) camAnim = null;
  };
}

let userHasRotated = false;
// Cancel any running camera animation the moment the user touches OrbitControls.
// Without this, animateCameraTo fights user input for its full duration.
controls.addEventListener('start', () => {
  camAnim = null;   // stop animation immediately — user has control
  userHasRotated = true;
  document.getElementById('reset-view-btn').classList.add('visible');
});

// Per-device camera offsets: camera position = hotspot + offset, looking at hotspot.
// Null means use azimuth-preserved default (same angle as overview).
const DEVICE_CAM_OFFSETS = {
  'tv-backlight':  new THREE.Vector3( 1.2, 0.8,  0.3),  // east of TV, looking west at screen
  'arc-lamp':      new THREE.Vector3( 0.8, 0.2, -0.5),  // SE below shade, looking NW up at drum

  'kitchen-light': new THREE.Vector3(-0.5, 0.3,  0.8),  // south of kitchen ceiling, looking up-north

};

function zoomToDevice(id) {
  const pos = HOTSPOT_POSITIONS[id];
  if (!pos) return;
  const deviceOffset = DEVICE_CAM_OFFSETS[id] ?? (() => {
    const currentOffset = getCamOffset();
    const azimuth = Math.atan2(currentOffset.x, currentOffset.z);
    const closeRadius = 0.7, closeHeight = 0.9;
    return new THREE.Vector3(Math.sin(azimuth)*closeRadius, closeHeight, Math.cos(azimuth)*closeRadius);
  })();
  animateCameraTo(pos[0], pos[2], deviceOffset, 750, 1.1, pos[1]);
  openBubble(id);
  // Briefly flash the selected ring
  Object.entries(hotspotRingEls).forEach(([rid, ring]) => ring.classList.toggle('selected', rid === id));
  setTimeout(() => hotspotRingEls[id]?.classList.remove('selected'), 600);
}

function zoomCameraToDevice(id) {
  // Zoom only — no bubble. Used when panel is already open.
  const pos = HOTSPOT_POSITIONS[id];
  if (!pos) return;
  const deviceOffset = DEVICE_CAM_OFFSETS[id] ?? (() => {
    const currentOffset = getCamOffset();
    const azimuth = Math.atan2(currentOffset.x, currentOffset.z);
    const closeRadius = 0.7, closeHeight = 0.9;
    return new THREE.Vector3(Math.sin(azimuth)*closeRadius, closeHeight, Math.cos(azimuth)*closeRadius);
  })();
  animateCameraTo(pos[0], pos[2], deviceOffset, 600, 1.1, pos[1]);
  // Highlight selected card in panel
  panelCards.querySelectorAll('.device-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.deviceId === id);
  });
}

function resetCamera() {
  selectedRoom = null;
  setActiveRoomBtn(null);
  userHasRotated = false;
  document.getElementById('reset-view-btn').classList.remove('visible');
  const defaultOffset = new THREE.Vector3(
    DEFAULT_CAM.x - DEFAULT_CAM.tx,
    DEFAULT_CAM.y,
    DEFAULT_CAM.z - DEFAULT_CAM.tz
  );
  animateCameraTo(DEFAULT_CAM.tx, DEFAULT_CAM.tz, defaultOffset, 900, CAM_SIZE);
  closeRoomPanel();
}

// RAYCASTING
// ─────────────────────────────────────────────
const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',(e)=>{
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(roomTargets);
  if(hits.length>0) { selectRoom(hits[0].object.userData.room); return; }
  // Check hotspot dots
  const visibleHotspots = Object.values(hotspotMeshes).filter(m => m.visible);
  const hsHits = raycaster.intersectObjects(visibleHotspots);
  if(hsHits.length>0) { zoomToDevice(hsHits[0].object.userData.hotspot); return; }
  // Click outside bubble closes it
  if(activeBubbleId && !bubbleEl.contains(e.target)) closeBubble();
});

function buildFocusGrid(){focusGrid.length=0;focusGrid.push([...document.querySelectorAll('.room-btn')]);focusGrid.push([...document.querySelectorAll('.scene-btn')]);}
function getFocused(){const r=focusGrid[focusRow];return r?r[Math.min(focusCol,r.length-1)]:null;}
function moveFocus(dr,dc){const nr=Math.max(0,Math.min(focusGrid.length-1,focusRow+dr));const nc=Math.max(0,Math.min((focusGrid[nr]||[]).length-1,focusCol+dc));document.querySelectorAll('.focus').forEach(el=>el.classList.remove('focus','focus-ring'));focusRow=nr;focusCol=nc;const el=getFocused();if(el){el.classList.add('focus','focus-ring');el.scrollIntoView({block:'nearest'});}}
document.addEventListener('keydown',(e)=>{
  const K=e.key||'',C=e.keyCode||0;
  if(K==='ArrowUp'||C===38||C===19){e.preventDefault();moveFocus(-1,0);return;}
  if(K==='ArrowDown'||C===40||C===20){e.preventDefault();moveFocus(1,0);return;}
  if(K==='ArrowLeft'||C===37||C===21){e.preventDefault();moveFocus(0,-1);return;}
  if(K==='ArrowRight'||C===39||C===22){e.preventDefault();moveFocus(0,1);return;}
  if(K==='Enter'||K===' '||C===13||C===23){e.preventDefault();getFocused()?.click();return;}
  if(K==='Escape'||C===27||C===4){e.preventDefault();if(selectedRoom)resetCamera();else document.querySelectorAll('.focus').forEach(el=>el.classList.remove('focus','focus-ring'));return;}
});

// ─────────────────────────────────────────────
// PARENT FRAME BRIDGE (Couch TV postMessage)
// ─────────────────────────────────────────────
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'dpad') { moveFocus(d.dy||0, d.dx||0); return; }
  if (d.type === 'ok')   { getFocused()?.click(); return; }
  if (d.type === 'back') {
    if (selectedRoom) resetCamera();
    else document.querySelectorAll('.focus').forEach(el=>el.classList.remove('focus','focus-ring'));
    return;
  }
});

// ─────────────────────────────────────────────
// SCENE BUTTONS
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// ROOM + SCENE BUTTONS
// ─────────────────────────────────────────────
function setActiveRoomBtn(roomId) {
  document.querySelectorAll('.room-btn').forEach(b => b.classList.toggle('active', b.dataset.room === roomId));
}

document.querySelectorAll('.room-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const room = ROOMS.find(r => r.id === btn.dataset.room);
    if (room) selectRoom(room);
  });
});

document.querySelectorAll('.scene-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const preset=SCENES[btn.dataset.scene]; if(!preset)return;
    document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    for(const[id,[on,bri]]of Object.entries(preset)){if(lightState[id]){lightState[id].on=on;lightState[id].brightness=bri;}}
    applyLightState();
    if (window.dispatchSmartHomeCommand) Object.entries(preset).forEach(([id,[on,bri]])=>{ if(lightState[id]) window.dispatchSmartHomeCommand(id,{on,brightness:bri}); });
    // refresh panel cards if open
    if (selectedRoom) openRoomPanel(selectedRoom);
  });
});

// ─────────────────────────────────────────────
// CLOCK
// ─────────────────────────────────────────────
function updateClock(){const n=new Date();document.getElementById('clock').textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');}
updateClock(); setInterval(updateClock,10000);

// ─────────────────────────────────────────────
// RESIZE
// ─────────────────────────────────────────────
window.addEventListener('resize',()=>{
  const w=container.clientWidth,h=container.clientHeight,a=w/h;
  camera.left=-CAM_SIZE*a; camera.right=CAM_SIZE*a;
  camera.top=CAM_SIZE; camera.bottom=-CAM_SIZE;
  camera.updateProjectionMatrix(); renderer.setSize(w,h);
});

// ─────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────
function animate(now=0) {
  requestAnimationFrame(animate);
  if(camAnim) camAnim(now);
  controls.update();
  // Pulse emissive glows
  const p = 0.80 + 0.20*Math.sin(now*0.0010);
  EMIT.warmGlow.emissiveIntensity = 1.1*p;
  EMIT.warmDim.emissiveIntensity  = 0.6*p;
  EMIT.barGlow.emissiveIntensity  = 1.2*p;
  EMIT.pinkGlow.emissiveIntensity = 0.85*(0.75+0.25*Math.sin(now*0.0023));
  // Hotspot 3D dots stay in scene for raycasting — but are visually transparent.
  // The CSS ring indicator above handles the visual.
  // (no per-frame update needed)
  // Project hotspot ring overlays + bubble to screen
  const cw = renderer.domElement.clientWidth, ch = renderer.domElement.clientHeight;
  for (const [id, m] of Object.entries(hotspotMeshes)) {
    const ring = hotspotRingEls[id];
    if (!m.visible) { ring.style.display='none'; continue; }
    const wp = m.position.clone().project(camera);
    const sx = (wp.x+1)/2*cw, sy = (-wp.y+1)/2*ch;
    ring.style.display = 'block';
    ring.style.left = (sx - 16) + 'px'; ring.style.top = (sy - 16) + 'px';
  }
  if (activeBubbleId && hotspotMeshes[activeBubbleId]?.visible) {
    const wp = hotspotMeshes[activeBubbleId].position.clone().project(camera);
    const sx = (wp.x+1)/2*cw, sy = (-wp.y+1)/2*ch;
    const bw = bubbleEl.offsetWidth || 210;
    const panelOffset = panelEl.style.visibility === 'visible' ? 272 : 0;
    bubbleEl.style.left = Math.min(sx - bw/2, cw - bw - panelOffset - 8) + 'px';
    bubbleEl.style.top  = Math.max(8, sy - bubbleEl.offsetHeight - 16) + 'px';
  }
  renderer.render(scene3, camera);
}

buildFocusGrid();
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  document.getElementById('loading').classList.add('hidden');
  setTimeout(()=>document.getElementById('loading').remove(),750);
}));
animate();

window.smartHome3D = {
  selectRoom: id => { const r=ROOMS.find(r=>r.id===id); if(r) selectRoom(r); },
  resetView:  resetCamera,
  setLightState: (id,on,bri) => { if(lightState[id]){lightState[id].on=on;if(bri!=null)lightState[id].brightness=bri;applyLightState();} },
  activateScene: id => { const btn=document.querySelector(`.scene-btn[data-scene="${id}"]`); if(btn) btn.click(); },
  zoomToDevice,
  zoomCameraToDevice,
};
</script>
<script src="smarthome-adapter.js"></script>
